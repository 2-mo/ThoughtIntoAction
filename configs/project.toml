# Portable defaults. Machine-specific overrides belong in local.toml.
default_command = "teleop-presets-x5"

[environment]
teleop_python = ".venv/bin/python"
arm_sdk_python = "outputs/build/arx-gripper/source/python"

[paths]
log_dir = "outputs/logs"
dataset_dir = "~/work/data/quest_x5"
checkpoint_dir = "~/work/models/pi05_base"
installer_dir = "~/work/installers/ThoughtIntoAction"

[robot]
can_port = "can0"
can_device = "/dev/arx_r5"
urdf = "assets/robots/x5/X5_2025_hybrid.urdf"

[cameras.wrist_rgb]
label = "腕部相机"
enabled = true
driver = "realsense"
model = "D435i"
serial = ""
hand_eye_calibrated = false
width = 640
height = 480
fps = 30
# Raw calibration sessions live in outputs/calibration; episode recording is separate.

[camera_service]
default_camera_id = "wrist_rgb"
socket = "outputs/runtime/camera.sock"

[runtime]
socket = "outputs/runtime/teleop.sock"

[telemetry]
# Display-only full scale; X5 SDK gripper_torque_max (N*m).
gripper_torque_max_nm = 1.5
# One-way robot state stream. Monitor processes may start/stop independently.
endpoint = "tcp://127.0.0.1:5567"

[arm_service]
max_joint_acceleration_rad_s2 = 2.0
max_joint_jerk_rad_s3 = 10.0
home_speed_rad_s = 0.3
home_acceleration_rad_s2 = 0.5
home_jerk_rad_s3 = 2.0
preset_speed_rad_s = 0.5
preset_acceleration_rad_s2 = 1.0
preset_jerk_rad_s3 = 4.0
socket = "outputs/runtime/arm.sock"
backend = "stanford"
control_rate_hz = 240
max_joint_speed_rad_s = 2.0
max_command_lead_rad = 0.05
joint_soft_limit_margin_rad = 0.05
preview_time_s = 0.03
teleop_preview_time_s = 0.01
gripper_width = 0.082
# Command limit only; keep the SDK width/angle mapping unchanged.
gripper_open_limit_m = 0.078
gripper_open_readout = -3.4
gripper_contact_torque = 0.60
gripper_hold_torque = 0.30
gripper_contact_cycles = 1
gripper_release_margin_m = 0.004

# 机械臂控制服务统一执行；所有控制客户端共用，遥操脚本不可覆盖。
[arm_safety]
table_enabled = true
table_z_m = 0.0
# 底座直接放在桌面上，允许夹指尖端中心到达桌面。
table_clearance_m = 0.0

[recording]
camera_ids = ["wrist_rgb"]
package_on_task_end = true
rgb_video = true
video_crf = 20
queue_size = 1024
min_free_bytes = 2147483648
max_duration_s = 120
min_duration_s = 2.0
max_state_gap_s = 0.1
max_frame_gap_s = 0.15
max_sync_skew_s = 0.06

[policy]
host = "127.0.0.1"
training_location = "remote"
# This records the existing checkpoint format; no inference backend is installed.
checkpoint_format = "lerobot"

[viewer_service]
port = 18081
camera = true

# Every TCP / UDP port the platform listens on. `./run.sh ports` shows owners and conflicts.
# The monitor port is [viewer_service].port and the legacy telemetry port is [telemetry].endpoint.
[ports]
console = 8000            # apps/console 网页与后端（web console）
console_backend = 8766    # 控制台后端单独运行（python -m embodied.applications.console）
vision = 8765             # 手势识别 WebSocket
camera_webrtc = 8767      # 相机 WebRTC 信令
collection_camera = 8768  # 采集相机信令
frontend_dev = 5173       # Vite 开发服务器（web preview）
phone_udp = 5005          # iPhone 位姿 UDP（phone run）
xr_service = 63901        # XRoboToolkit PC Service，经 adb reverse 连接 Quest
site = 8090               # 宣传网站本地预览（web site）


[project]
name = "embodied-control-runtime"
version = "0.2.0"
description = "Isolated robot control runtime and optional hardware plugins"
readme = "../../../docs/guides/control-runtime.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.15.3",
    "ruckig==0.12.2",
    "mujoco==3.6.0",
    "iceoryx2==0.9.1",
]

[project.optional-dependencies]
arx = ["arx5-interface==0.1.3"]

[dependency-groups]
sdk-build = ["pybind11==3.1.0"]

[tool.uv]
# Source lives under src/; this file defines the isolated control environment.
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# 策略页「模型」卡片区登记表。
# 页面只会发送模型 id；挂载/卸载执行的命令全部来自这里，前端无法传入命令。
# {log} 会被替换成 outputs/logs/models/<id>.log。

[[models]]
id = "towel_v2_local"
name = "叠毛巾 v2 · 本地 5070"
prompt = "Fold the towel on the table."
url = "ws://127.0.0.1:8008"
# 本地模型目录：serve.pid 决定「谁占着端口」，8008 同一时间只能跑一个模型。
local_dir = "/home/arx/work/models/towel_v2"
vram = "约 7.1 GB 显存"
note = "首次启动约 2–4 分钟"
mount = [
  "/home/arx/work/openpi/.venv/bin/python", "/home/arx/work/deploy_model.py",
  "serve", "towel_v2", "--port", "8008", "--gpu", "0", "--mem-fraction", "0.9",
]
unmount = [
  "/home/arx/work/openpi/.venv/bin/python", "/home/arx/work/deploy_model.py",
  "stop", "towel_v2",
]


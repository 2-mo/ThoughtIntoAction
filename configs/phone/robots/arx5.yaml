robot:
  type: arx5
  implemented: foundation_only
  hardware_enabled: false
  note: >-
    Offline model metadata plus a fail-closed Phase 5 SDK boundary. Active
    hardware control remains disabled until the installed arm variant, limits,
    stop behavior, SDK, CAN interface, and gripper calibration are verified.

model:
  name: arx5-x5
  urdf: ../../../assets/phone/robots/arx5/X5.urdf
  base_frame: base_link
  end_effector_frame: eef_link
  joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
  source:
    repository: https://github.com/real-stanford/arx5-sdk
    commit: 8ccbf0aa8d4288f2721c41a735e5ac4c389bb13b
    license: MIT

# These are the X5 factory values in the cited SDK configuration, not yet a
# statement about the particular physical arm. They are only used for offline
# feasibility checks in Phase 4 and cannot enable hardware.
joint_limits:
  position_lower_rad: [-3.14, -0.05, -0.1, -1.6, -1.57, -2.0]
  position_upper_rad: [2.618, 3.5, 3.2, 1.55, 1.57, 2.0]
  velocity_max_rad_s: [5.0, 5.0, 5.5, 5.5, 5.0, 5.0]

offline_check:
  # A model-only seed with better Jacobian conditioning than all zeros. This
  # must never be interpreted as a command or a verified physical home pose.
  reference_joint_position_rad: [0.0, 1.0, 1.0, 0.0, 0.0, 0.0]
  maximum_branch_step_rad: 0.35

runtime:
  input: arkit
  transport: udp
  policy: relative-pose
  robot: mock
  controller: cartesian-position

control:
  rate_hz: 200

receiver:
  poll_interval_ms: 0

network:
  bind_host: 0.0.0.0
  bind_port: 5005
  receive_timeout_ms: 100
  max_datagram_size: 2048
  max_drain_datagrams: 64
  receive_buffer_bytes: 1048576

mapping:
  position_scale: 2.0
  rotation_scale: 1.0
  # Human-aligned phone-to-gripper frame:
  # - phone top edge / forward -> gripper forward, eef +X
  # - phone right edge -> gripper right, eef -Y
  # - screen normal / face-up -> gripper up, eef +Z
  axes:
    robot_x: {source: input_y, sign: 1}
    robot_y: {source: input_x, sign: -1}
    robot_z: {source: input_z, sign: 1}

safety:
  hold_packet_age_ms: 50
  brake_packet_age_ms: 100
  stop_packet_age_ms: 300
  state_stale_timeout_ms: 100
  maximum_target_step_m: 0.05
  maximum_rotation_step_rad: 0.35
  maximum_linear_velocity_m_s: 0.5
  maximum_angular_velocity_rad_s: 1.5
  workspace:
    minimum_m: [0.0, -0.5, 0.0]
    maximum_m: [0.8, 0.5, 0.8]

hardware:
  enabled: false

[project]
name = "thought-into-action"
version = "0.1.0"
description = "知行有灵 · Thought into Action — Modular embodied intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arx5-interface==0.1.3",
    "numpy==2.3.5",
    "placo==0.9.3",
    "pin==3.7.0",
    "meshcat==0.3.2",
    "pyzmq==27.2.0",
    "tyro==1.0.16",
    "pyrealsense2==2.58.4.10922",
    "opencv-python==5.0.0.93",
    "xrobotoolkit-sdk==1.0.2",
    "rich==14.3.3",
    "ruckig==0.12.2",
    "mcap==1.3.1",
]

[dependency-groups]
sdk-build = ["cmake==3.31.10", "pybind11==3.1.0"]
# Same version as the analysis environment, which reads the configuration below.
test = ["pytest==8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/motion and tests/phone run in their own environments (check-all groups motion / phone).
norecursedirs = [".*", "__pycache__", "node_modules", "motion", "phone", "browser"]
addopts = ["--strict-markers"]
markers = [
    "hardware: needs real devices (CAN, cameras, Quest); skipped unless --run-hardware",
    "sim: needs the MuJoCo control environment",
]

[tool.uv]
package = false
# Plain `uv sync --locked` keeps pytest, which `./run.sh test` needs.
default-groups = ["test"]
python-preference = "only-managed"
required-version = ">=0.11.0,<0.12"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Preserve the working C++ ABI set; broad upstream constraints permit incompatible libraries.
constraint-dependencies = [
    "cmeel==0.61.0",
    "cmeel-boost==1.87.0.1",
    "cmeel-urdfdom==4.0.1",
    "cmeel-tinyxml2==10.0.0",
    "cmeel-console-bridge==1.0.2.3",
    "cmeel-assimp==5.4.3.1",
    "cmeel-octomap==1.10.0",
    "cmeel-qhull==8.0.2.1",
    "coal==3.0.1",
    "eigenpy==3.10.3",
    # 1.3.2 in the old environment requires Boost 1.90, conflicting with Pin 3.7.
    "eiquadprog==1.2.9",
    "rhoban-cmeel-jsoncpp==1.9.4.9",
    "ischedule==1.2.7",
]

[tool.uv.sources]
xrobotoolkit-sdk = { git = "https://github.com/XR-Robotics/XRoboToolkit-PC-Service-Pybind.git", rev = "c64ccf6acd577a333e03b66fafe8efeeceb511b1" }

# Quest adapter support is maintained under src/embodied/devices/inputs/quest/_vendor.
# The native binding is a pinned package; install its companion library with
# ./run.sh rebuild-xr-sdk. third_party contains read-only references only.

[tool.uv.extra-build-dependencies]
xrobotoolkit-sdk = ["setuptools==83.0.0", "wheel==0.47.0", "pybind11[global]==3.1.0", "cmake==3.31.10"]

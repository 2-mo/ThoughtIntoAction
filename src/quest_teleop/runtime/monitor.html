<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuestArmTeleop · 运行监看</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#111820;color:#e2ebf3}body{max-width:1100px;margin:32px auto;padding:0 20px}h1{font-size:24px}header{display:flex;justify-content:space-between;align-items:center}small{color:#a7b9c8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}section{background:#1b2632;padding:20px;border-radius:10px;margin-top:18px}img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#0d131b}canvas{width:100%;height:220px;background:#111820}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.bad{color:#ffb284}.ok{color:#85d9ae}table{width:100%;text-align:right;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}td,th{padding:6px;border-bottom:1px solid #30404f}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
<header><h1>QuestArmTeleop · 运行监看</h1><small>只读 · 操作从终端执行</small></header>
<p id="health">等待运行中的遥操会话…</p>
<div class="grid"><section><h2>腕部 D435i</h2><img id="camera" alt="相机尚未就绪"><p id="cameraStatus"></p></section>
<section><h2>机械臂</h2><table><thead><tr><th>关节</th><th>反馈 rad</th><th>提交 rad</th><th>误差 rad</th></tr></thead><tbody id="joints"></tbody></table><p id="mode"></p><small>力矩来自 SDK 电机估算；画面与曲线约 5 Hz 更新。</small></section></div>
<section><h2>最近一分钟关节跟踪误差</h2><canvas id="plot" width="1000" height="220"></canvas><small>J1–J6：蓝 / 绿 / 橙 / 紫 / 红 / 青。曲线表示提交目标减反馈。</small></section>
<section><h2>采集状态</h2><pre id="recording">未录制</pre></section>
<script>
const $=id=>document.getElementById(id), history=[], colors=['#7ab4ff','#85d9ae','#efbc7a','#b5a4ff','#ff9494','#7cdae1'];
function draw(){const c=$('plot'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);const bound=Math.max(.01,...history.flat().map(Math.abs));g.strokeStyle='#30404f';g.beginPath();g.moveTo(0,110);g.lineTo(1000,110);g.stroke();g.fillStyle='#a7b9c8';g.fillText(`±${bound.toFixed(3)} rad`,10,15);for(let j=0;j<6;j++){g.strokeStyle=colors[j];g.beginPath();history.forEach((v,i)=>{const x=i/299*1000,y=110-v[j]/bound*90;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()}}
async function poll(){try{const response=await fetch('/status');if(!response.ok)throw Error('遥操会话未连接');const s=await response.json(),q=s.state,age=s.state_age_s;const stale=age===null||age>.5;$('health').className=stale?'bad':'ok';$('health').textContent=`${stale?'反馈已过期':'运行中'} · ${s.mode==='simulation'?'虚拟演练':(s.actuate?'执行已启用':'只读/阻尼')} · PID ${s.pid} · ${age===null?'暂无反馈':(age*1000).toFixed(0)+' ms'}`;if(q){const target=q.submission?.pos;$('joints').replaceChildren();q.actual_pos.forEach((value,i)=>{const tr=document.createElement('tr');[String(i+1),value.toFixed(4),target?target[i].toFixed(4):'—',target?(target[i]-value).toFixed(4):'—'].forEach(text=>{const td=document.createElement('td');td.textContent=text;tr.append(td)});$('joints').append(tr)});$('mode').textContent=`来源 ${q.source}${q.preset_name?' · '+q.preset_name:''} · 夹爪 ${(q.gripper_actual_pos*1000).toFixed(1)} mm`;if(target&&!stale){history.push(target.map((v,i)=>v-q.actual_pos[i]));if(history.length>300)history.shift();draw()}}const ca=s.camera.age_s;$('cameraStatus').textContent=s.camera.error||(ca===null?'相机启动中':ca<.5?'相机画面正常':'相机画面已过期');if(ca!==null&&ca<.5){$('camera').style.opacity=1;$('camera').src='/camera.jpg?t='+Date.now()}else{$('camera').style.opacity=.25}$('recording').textContent=JSON.stringify(s.recording||s.last_episode||'未录制',null,2)+(s.runtime_error?'\n'+s.runtime_error:'')}catch(e){$('health').className='bad';$('health').textContent=e.message;$('camera').style.opacity=.25}finally{setTimeout(poll,200)}}poll();
</script></html>

const details={
 planning:{title:'运动规划',tag:'ALGORITHMS / OPERATIONS',description:'复用 Ruckig、路径插补、SE(3)、碰撞检查和运动学算法。arx 工作台已有 MoveJ / MoveL、预览、点动和取消接口。',paths:['src/arx5_control/motion/','src/operations/','control/adapters/commands.py','src/reBotArm_control_py/trajectory/'],boundary:'规划库与操作执行分别维护；高级算法登记为插件，不代表已经全部接入公共规划器。'},
 calibration:{title:'自动标定',tag:'CALIBRATION WORKFLOWS',description:'工作台手眼流程通过 arx 机械臂适配器执行；迁入的双相机工作流还包括眼在手上 / 眼在手外、求解、质量与结果管理。',paths:['src/handeye_calibration/','src/hand_eye_calibration/','src/arx_tools/calibrate_payload.py','calibrations/arx_motion/'],boundary:'两个标定包属于不同工作流。前者已有 gateway 适配；迁入双相机流程仍保留独立控制器。'},
 vision:{title:'视觉任务与网页控制',tag:'PERCEPTION / TASKS',description:'Vue / Three.js 控制台、Ghost、手势页面、方块感知与抓取、旋转、堆叠任务按功能分层。',paths:['apps/console/','src/arx5_backend/','src/experiments/','src/arx_tools/rgb_cube_detector.py'],boundary:'网页运动与方块任务尚未全部改为 arx gateway 客户端。目前经独立操作入口运行。'},
 policy:{title:'模型策略',tag:'POLICY / INFERENCE',description:'保留 GR00T 权重检查、模型服务、异步预测与动作分块，以及 OpenPI 相关推理入口。',paths:['src/gr_zeroshot/','src/infer_after_sft/','src/zero-shot/','integrations/openpi/'],boundary:'模型推理与控制环境隔离。迁入的实机动作执行仍有独立控制流程；训练数据、动作定义与统计需匹配。'},
 vr:{title:'Quest 与原生 VR 驱动',tag:'VR / NATIVE INPUT',description:'Quest 提供位姿、按键和追踪状态。arx 的设备插件只负责原生输入进程与坐标基转换，映射与模式交给路由。',paths:['control/adapters/composition.py','control/arx5_vr/native_config.py','control/native/README.md'],boundary:'vr.arx.quest / vr.arx.demo 分别支持真实头显与合成输入；不会在外部重复实现 Quest IK。'},
 phone:{title:'手机 ARKit 控制源',tag:'PHONE / INPUT SOURCE',description:'iOS ARKit 通过 UDP 提供姿态；工作台适配负责离合、tool/base 相对映射、追踪与显式租约。',paths:['apps/ios/','src/inputs/phone.py','src/robot_teleop/'],boundary:'工作台手机来源已接入网关。robot_teleop 中原独立控制和诊断工具也保留，二者入口需区分。'},
 motion:{title:'CLI 与多源动作',tag:'MOTION / SOURCE',description:'工作台提供点动、夹爪、示教、MoveJ / MoveL、计划预览、执行与取消。控制源按租约申请和释放控制权。',paths:['src/operations/','src/inputs/idle.py','src/runtime_client/'],boundary:'预览不获取运动控制权；执行会核验计划、起点、模型、有效期与 owner epoch。'},
 routing:{title:'模式协调与遥操路由',tag:'COORDINATOR / ROUTER',description:'优先复用 arx 原 coordinator 与 arm/gripper router：处理模式确认、许可、相对位姿、夹爪和健康闭环。',paths:['control/adapters/composition.py','control/arx5_vr/native_config.py','control/native/README.md'],boundary:'VR 驱动、状态机、映射和最终控制分别解耦；输入故障的影响由活动路由与许可决定。'},
 gateway:{title:'命令入口与网关',tag:'INGRESS / GATEWAY',description:'原生入口消费 bridge、permit 与 health 产生候选命令；公共执行边界校验控制权、epoch、时效和操作状态。',paths:['control/adapters/sources.py','control/adapters/gateway.py','control/adapters/commands.py','src/runtime_client/'],boundary:'arx 工作台的 Quest、手机、CLI 和标定适配共享此边界。迁入的独立操作尚未全部使用它。'},
 controller:{title:'目标控制器与 IK',tag:'CONTROLLER / 250 Hz',description:'worker 持有 250 Hz 控制周期，目标控制器处理关节或笛卡尔目标与 IK。real/sim 采用相同注入点。',paths:['control/arx5_vr/worker.py','control/arx5_vr/model.py'],boundary:'复用 arx 原算法与时序。输入、页面、相机和记录频率不改变控制循环的时钟所有权。'},
 robot:{title:'ARX X5 与 MuJoCo',tag:'ROBOT BACKEND',description:'机械臂后端负责读取状态、执行目标、发布遥测和关闭。当前 worker 的模型、轴顺序与夹爪接口面向 X5。',paths:['control/adapters/backends.py','control/arx5_vr/real.py','control/arx5_vr/sim.py','control/models/x5/'],boundary:'robot.arx.real 与 robot.arx.sim 可替换执行介质；后端独占设备，控制器与上层接口保持一致。'},
 rebot:{title:'B601 DM / RS',tag:'INDEPENDENT DEVICE PLUGINS',description:'迁入完整电机、夹爪、运动学、动力学、轨迹、拖动保持及 MeshCat 示例。device.rebot_dm / device.rebot_rs 在独立环境运行。',paths:['src/reBotArm_control_py/','configs/rebot/','assets/robots/rebot/','examples/rebot/'],boundary:'B601 尚未接入 X5 worker。DM/RS 的轴映射和模型不同，需要对应协议适配后才能进入同一工作台。'},
 camera:{title:'相机与视觉输入',tag:'CAMERA / SENSOR',description:'工作台提供共享 RealSense 与合成相机；迁入双相机 RGB-D、WebRTC 和视觉服务。帧携带身份、时间与内参。',paths:['src/robot_core/camera_service.py','src/robot_core/camera_client.py','src/robot_core/synthetic_camera.py','src/arx5_backend/features/camera/'],boundary:'工作台相机与迁入 RGB-D 服务当前并存。预览、原始采图和设备占用需要分别管理。'},
 observations:{title:'观测对齐',tag:'OBSERVATION / ALIGNMENT',description:'把机器人反馈、已提交命令和图像按明确的时间规则关联；保留原始时间、序号、帧身份和缺失证据。',paths:['src/observations/','src/collection/','src/dataset_tools/runtime_v2.py'],boundary:'观测层不拥有相机或控制生命周期。不同数据定义各自选择对齐规则，不强制共享一种采样公式。'},
 collection:{title:'采集与封存',tag:'COLLECTION / EPISODE IO',description:'采集端订阅只读机器人流和相机流，文件层负责 episode、MCAP、视频与元数据。关闭和封存明确区分。',paths:['src/collection/','src/episode_io/','src/isaac_groot_data_collection/'],boundary:'工作台与 GR00T 双相机保留各自数据流程。记录流缺失或未完成封存时，不能标记为完整 episode。'},
 export:{title:'校验与导出',tag:'VALIDATION / EXPORT',description:'提供时间、完整性与对齐检查，并按版本输出 LeRobot v2.1、Parquet、视频与原始 sidecar。',paths:['src/dataset_tools/','src/isaac_groot_data_collection/','scripts/check_groot_export.py'],boundary:'格式相同不代表 action 相同。schema 2 使用已提交动作；GR00T 链路保留下一帧测量关节状态等原动作规则。'},
 dataset:{title:'LeRobot / GR00T 训练数据',tag:'DATASET / ACTION SEMANTICS',description:'保留两条训练数据链路。arx schema 2 明确记录反馈与已提交动作；迁入 GR00T 导出支持双 RGB、Rot6D 和 16 维定义。',paths:['src/dataset_tools/exporters.py','src/dataset_tools/runtime_v2.py','src/isaac_groot_data_collection/','docs/consolidated-components.md'],boundary:'选择模型时需要匹配数据 schema、action 定义与统计。121 帧合成双视频导出和官方 GR00T loader 已离线验证。'},
 assembly:{title:'公共装配与插件契约',tag:'REGISTRY / WORKSTATION',description:'注册表选择实现，profile 连接部件，workstation 管理进程生命周期。算法库、操作命令和运行环境分别建模。',paths:['src/component_api/','src/component_plugins/','src/workstation/','configs/workbench/','configs/components/'],boundary:'所有功能集中在一个维护仓库。模块边界不等同进程边界；旧 presets 仍保留原入口，归档仅供恢复。'}
};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let previousFocus=null,timer;
function openDetail(key){const d=details[key];if(!d)return;previousFocus=document.activeElement;$('detailTitle').textContent=d.title;$('detailTag').textContent=d.tag;$('detailDescription').textContent=d.description;$('detailBoundary').textContent=d.boundary;$('detailPaths').innerHTML=d.paths.map(p=>`<a class="path" href="../../${esc(p)}">${esc(p)} ↗</a>`).join('');$('overlay').hidden=false;$('close').focus()}
function closeDetail(){$('overlay').hidden=true;previousFocus?.focus()}
function notify(message){clearTimeout(timer);$('toast').textContent=message;$('toast').hidden=false;timer=setTimeout(()=>$('toast').hidden=true,3000)}
document.querySelectorAll('[data-detail]').forEach(node=>{node.addEventListener('click',()=>openDetail(node.dataset.detail));node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(node.dataset.detail)}})});
$('close').addEventListener('click',closeDetail);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)closeDetail();if(e.key==='Tab'&&!$('overlay').hidden){const links=[...$('overlay').querySelectorAll('button,a')];if(e.shiftKey&&document.activeElement===links[0]){e.preventDefault();links.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===links.at(-1)){e.preventDefault();links[0].focus()}}});
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{notify('当前浏览器不支持全屏，可使用浏览器的全屏功能')}});
function serializedPoster(){const svg=$('poster').cloneNode(true);svg.setAttribute('width','3200');svg.setAttribute('height','1800');svg.removeAttribute('class');const style=document.createElementNS('http://www.w3.org/2000/svg','style');style.textContent='text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.flow-line{stroke-dasharray:5 12}';svg.insertBefore(style,svg.firstChild);return new XMLSerializer().serializeToString(svg)}
async function exportPoster(){const button=$('download');button.disabled=true;const url=URL.createObjectURL(new Blob([serializedPoster()],{type:'image/svg+xml;charset=utf-8'}));try{await document.fonts.ready;const picture=new Image();await new Promise((resolve,reject)=>{picture.onload=resolve;picture.onerror=reject;picture.src=url});const canvas=document.createElement('canvas');canvas.width=3200;canvas.height=1800;canvas.getContext('2d').drawImage(picture,0,0,3200,1800);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw new Error('PNG export failed');const png=URL.createObjectURL(blob),a=document.createElement('a');a.href=png;a.download='QuestArmTeleop-架构海报.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(png),10000);notify('已导出 3200 × 1800 架构海报')}catch{notify('导出失败，可使用浏览器打印或截图')}finally{URL.revokeObjectURL(url);button.disabled=false}}
$('download').addEventListener('click',exportPoster);
const catalog=window.ARCHITECTURE_CATALOG;if(catalog)$('catalogSummary').textContent=`${catalog.plugins.length} 个注册实现 · ${catalog.commands.length} 个组件命令 · 1 个维护仓库`;

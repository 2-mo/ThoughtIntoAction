<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>知行有灵 · 项目架构与进展</title>
<link rel="stylesheet" href="progress.css"><script defer src="progress.js"></script><script defer src="progress-view.js"></script>
</head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-symbol" aria-hidden="true">知</span><strong>知行有灵</strong><span class="brand-en">Thought into Action</span></a><div class="top-actions"><button id="method">数据说明</button><a href="explorer.html">详细导览 ↗</a></div></header>
<main>
<section class="intro"><div><p class="eyebrow">PROJECT ARCHITECTURE &amp; PROGRESS</p><h1>项目整体设计与进展</h1><p class="intro-copy">在架构中看进展，在记录中看贡献。</p></div><p class="snapshot" id="snapshot">正在读取本地快照…</p></section>
<section class="metrics" aria-label="项目统计" id="metrics"></section>
<section class="workspace">
<div class="workspace-toolbar"><nav class="tabs" aria-label="查看方式"><button class="active" data-view="architecture" aria-pressed="true">架构进展</button><button data-view="commits" aria-pressed="false">提交记录</button><button data-view="contributors" aria-pressed="false">贡献者</button></nav><div class="filters"><label><span class="sr-only">提交时间范围</span><select id="period"><option value="all">全部历史</option><option value="30">近 30 天</option><option value="7">近 7 天</option></select></label><label><span class="sr-only">Git 提交作者</span><select id="author"><option value="all">全部作者</option></select></label><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索模块、提交、文件" aria-label="搜索模块、提交或文件"></label></div></div>
<div id="architectureView" class="architecture-layout">
<section class="diagram-pane" aria-label="交互式项目架构图"><div class="diagram-toolbar"><div class="legend"><span><i class="green"></i>计划全部关闭</span><span><i class="amber"></i>仍有未关闭项</span><span><i class="gray"></i>无关联计划</span></div><div class="diagram-actions"><button id="zoomOut" aria-label="缩小">−</button><button id="fit" title="适应宽度">适宽</button><button id="zoomIn" aria-label="放大">＋</button><button id="fullscreen">全屏</button><button id="exportSvg">SVG</button><button id="exportPng">PNG</button></div></div><div class="diagram-viewport" id="viewport"><div id="diagramMount"></div></div><p class="diagram-caption">点击模块查看计划、作者与提交。时间和作者筛选只影响 Git 活动，计划计数保持完整。</p></section>
<aside class="detail-panel" id="detailPanel" aria-label="模块与项目详情"></aside>
</div>
<section id="commitsView" class="list-view" hidden aria-label="Git 提交记录"></section><section id="contributorsView" class="list-view" hidden aria-label="贡献者记录"></section>
</section>
<footer class="footer"><span id="coverage"></span><span>计划勾选 ≠ 真机验收 · Git 作者 ≠ 模块负责人</span></footer>
<noscript>此页面需要 JavaScript 才能显示进展。可直接阅读 <a href="../plans/README.md">项目计划</a>。</noscript>
</main>
<dialog id="methodDialog"><button class="dialog-close" id="closeMethod" aria-label="关闭数据说明">×</button><p class="eyebrow">HOW TO READ</p><h2>每个数字，都有来源</h2><div id="methodContent"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>

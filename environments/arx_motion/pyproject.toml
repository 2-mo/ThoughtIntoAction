[project]
name = "arx5-control"
version = "0.1.0"
description = "ARX X5 robot control, calibration, and browser backend"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
control = [
  "arx5-interface==0.1.3",
  "ruckig==0.19.4",
  "pin==4.1.0",
]

backend = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

handeye = [
  { include-group = "control" },
  { include-group = "backend" },
  "msgpack==1.1.0",
  "msgpack-numpy==0.4.8",
  "numpy==2.2.6",
  "pyrealsense2==2.58.3.10794",
  "pyzmq==27.0.1",
  "opencv-contrib-python==4.12.0.88",
  "pytest==8.4.1",
  "websockets==16.1.1",
]

web = [
  "websockets==16.1.1",
  "aiortc==1.15.0",
  "av==17.1.0",
  "numpy==2.5.1",
  "opencv-python-headless==5.0.0.93",
  "pyarrow==23.0.1",
  "pyrealsense2==2.58.3.10794",
]

vision = [
  "mediapipe==0.10.35",
]

[tool.uv]
package = false
default-groups = []
conflicts = [
  [
    { group = "handeye" },
    { group = "web" },
  ],
  [
    { group = "handeye" },
    { group = "vision" },
  ],
  [
    { group = "web" },
    { group = "vision" },
  ],
]

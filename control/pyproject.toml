[project]
name = "arx-televr"
version = "0.2.0"
description = "Portable XRoboToolkit teleoperation for ARX X5 and MuJoCo"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.15.3",
    "mujoco==3.6.0",
    "iceoryx2==0.9.1",
]

[project.optional-dependencies]
arx = ["arx5-interface==0.1.3"]

[dependency-groups]
sdk-build = ["pybind11==3.1.0"]

[tool.uv]
# A source application: models/, config/ and native/ travel with this directory.
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
